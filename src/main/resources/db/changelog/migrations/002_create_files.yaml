databaseChangeLog:
  - changeSet:
      id: 003
      author: Nurbolot Abilov
      changes:
        - createTable:
            tableName: files
            columns:
              - column:
                  name: id
                  type: long
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: original_name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: stored_name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: content_type
                  type: varchar(100)

              - column:
                  name: file_path
                  type: varchar(500)
                  constraints:
                    nullable: false

              - column:
                  name: is_public
                  type: boolean
                  defaultValueBoolean: false
                  constraints:
                    nullable: false

              - column:
                  name: share_key
                  type: varchar(255)

              - column:
                  name: upload_date
                  type: timestamp
                  constraints:
                    nullable: false

              - column:
                  name: download_count
                  type: int
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: user_id
                  type: long
                  constraints:
                    nullable: false
                    foreignKeyName: fk_files_users
                    references: users(id)
                    deleteCascade: true